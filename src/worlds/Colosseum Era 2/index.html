<html>
<head>
  <!-- Circles' head scripts [REQUIRED] -->
  <circles-start-scripts/>

  <!--other scripts-->
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

</head>
<body>
  <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
  <circles-start-ui/>

  <!-- a-scene with 'circles-properties' component [REQUIRED] -->
  <a-scene circles_scene_properties fog="type: none" enable-navmesh>
    <a-assets>

      <!--models-->
      <a-asset-item id="coloera1" src="assets/models/colera2finalv2.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>
      
      <a-asset-item id="colFpalace" src="assets/models/colera2finalPalace.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFfort" src="assets/models/colera2finalFort.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFfloor" src="assets/models/colera2finalFloor.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFplants" src="assets/models/colera2finalplantsv2.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

        <a-asset-item id="colFobjects" src="assets/models/colera2finalObjectsv3.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>


      <a-asset-item id="e1tree" src="assets/models/trees2.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>
      <a-asset-item id="e1floor" src="assets/models/floorEra1.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>
      <a-asset-item id="e1build" src="assets/models/era1Buildings.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colera1Nav" src="assets/models/colera2nav1.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="detailObjects" src="assets/models/era1Objectsv3.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="restCol" src="assets/models/colera1baked.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <!--artifacts-->
      <a-asset-item id="bible" src="assets/models/bible.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="cross" src="assets/models/cross.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="cup" src="assets/models/cup.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="painting" src="assets/models/painting.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

      <!-- dont use
      
      
      -->

      <!-- HDRI -->
      <img id='skyMap' src='assets/textures/hdri1.jpg' crossorigin="anonymous">

      <!-- Circles' built-in assets [REQUIRED] -->
      <circles-assets/>
    </a-assets>

    <!-- Circles' built-in manager and avatar [REQUIRED] -->
    <circles-manager-avatar/>

    </a-entity>
    <!-- Spawning pad -->
   
    <a-entity circles-checkpoint circles-spawnpoint position="2 18.05 2.5"></a-entity> <!-- old 10 , 0.05, 32-->
    
    <!--teleport pads -->
    <!--entry ramp-->
    <a-entity circles-checkpoint position="-3.5 8.05 -9"></a-entity>
    <a-entity circles-checkpoint position="-0.8 14.05 -3.5"></a-entity>
    <a-entity circles-checkpoint position="1 18.05 1"></a-entity>

    <!--first criss-cross-->
    <a-entity circles-checkpoint position="9.5 18.05 -1.5"></a-entity>
    <a-entity circles-checkpoint position="5 18.05 -9"></a-entity>
    <a-entity circles-checkpoint position="-2.5 18.05 -21"></a-entity>
    <a-entity circles-checkpoint position="-3.5 18.05 -27.5"></a-entity>
    <a-entity circles-checkpoint position="3 18.05 -25"></a-entity>
    <a-entity circles-checkpoint position="10 18.05 -15"></a-entity>
    <a-entity circles-checkpoint position="15 18.05 -6.5"></a-entity>
    <a-entity circles-checkpoint position="4 18.05 -32.5"></a-entity>
    <a-entity circles-checkpoint position="11 18.05 -26"></a-entity>
    <a-entity circles-checkpoint position="17 18.05 -18.5"></a-entity>

    <!--first hallway-->
    <a-entity circles-checkpoint position="23 18.05 -14"></a-entity>
    <a-entity circles-checkpoint position="28 18.05 -19"></a-entity>
    <a-entity circles-checkpoint position="32 18.05 -24"></a-entity>
    <a-entity circles-checkpoint position="37 18.05 -28.5"></a-entity>
    <a-entity circles-checkpoint position="41 18.05 -36"></a-entity>
    <a-entity circles-checkpoint position="45 18.05 -43"></a-entity>
    <a-entity circles-checkpoint position="48 18.05 -50"></a-entity>

    <!--offshoots-->
    <a-entity circles-checkpoint position="24 18.05 -30.5"></a-entity>
    <a-entity circles-checkpoint position="16 18.05 -36.5"></a-entity>
    <a-entity circles-checkpoint position="32 18.05 -41"></a-entity>
    <a-entity circles-checkpoint position="21 18.05 -46.5"></a-entity>

    <!--second area-->
    <a-entity circles-checkpoint position="35 18.05 -54.5"></a-entity>
    <a-entity circles-checkpoint position="23.5 18.05 -57.5"></a-entity>
    <a-entity circles-checkpoint position="20 18.05 -65.5"></a-entity>
    <a-entity circles-checkpoint position="9 17.55 -55"></a-entity>
    <a-entity circles-checkpoint position="10.5 17.55 -62"></a-entity>
    <a-entity circles-checkpoint position="9.5 17.55 -70"></a-entity>

    <!--second hallway-->
    <a-entity circles-checkpoint position="8 17.75 -77.5"></a-entity>
    <a-entity circles-checkpoint position="7.5 17.75 -90"></a-entity>
    <a-entity circles-checkpoint position="17 17.75 -91.5"></a-entity>
    <a-entity circles-checkpoint position="20.5 18.05 -87.5"></a-entity>

    <!--upper ramp-->
    <a-entity circles-checkpoint position="30.5 18.55 -90"></a-entity>
    <a-entity circles-checkpoint position="38.5 26.05 -93"></a-entity>
    <a-entity circles-checkpoint position="44 29.65 -94.5"></a-entity>

    <!--upper hallway-->
    <a-entity circles-checkpoint position="50 29.65 -82.5"></a-entity>
    <a-entity circles-checkpoint position="49 29.65 -90"></a-entity>
    <a-entity circles-checkpoint position="47 29.65 -98.5"></a-entity>
    <a-entity circles-checkpoint position="43.5 29.95 -106"></a-entity>
    
    <!-- start your code: put your A-frame, Circles XR, and custom components here -->
 
    <!--environment-->
    <a-entity id="coloera2" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#coloera1" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="colera1Nav"  position="0 -0.75 0" scale="0.5 0.5 0.5" gltf-model="#colera1Nav" visible='false' nav-mesh></a-entity>

    <a-entity id="coloera2Palace" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFpalace" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="coloera2Fort" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFfort" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="coloera2Floor" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFfloor" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="colera2Plants" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFplants" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="colera2Objects" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFobjects" shadow="cast:false; recieve:false;" material="shader: flat;"></a-entity>
    
    

    

    <a-entity id="colera1Nav"  position="0 -1.0 0" scale="0.5 0.5 0.5" gltf-model="#colera1Nav" visible='true' nav-mesh></a-entity>

    <a-entity id="sky" geometry="primitive:sphere; radius:350.0;"  material="src:#skyMap; shader:flat; flatShading:true; side:back;"></a-entity>
 

    <a-entity light="type: ambient; color: #dec07a" intensity="0.3"></a-entity>
    <a-light type="directional" color="#dec07a" intensity="1" position="-1 1 1"></a-light>
    

    <!-- dont use
      <a-entity id="detailObjects" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#detailObjects" shadow="cast:true; recieve:true;"></a-entity>
      <a-entity id="era1Floor" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#e1floor" shadow="cast:false; recieve:true;"></a-entity>
      <a-entity id="era1Buildings" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#e1build" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="era1tree" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#e1tree" shadow="cast:false; recieve:true;"></a-entity>
    <a-entity id="colera2Nav"  position="0 -0.5 0" scale="0.5 0.5 0.5" gltf-model="#colera1Nav"  visible='false' nav-mesh></a-entity>

 <a-entity id="restCol" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#restCol" shadow="cast:false; recieve:true;"></a-entity>
    <a-entity id="blockwall" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#block" shadow="cast:false; recieve:true;"></a-entity>
      -->

    <!--objects-->
    <a-entity id="bible" position="6.5 39 -91" rotation="0 -30 0" scale="0.5 0.5 0.5" gltf-model="#bible" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:bible;
    description:jesus christ book" circles-pickup-networked></a-entity>
    <a-entity id="cup" position="39 40.4 -33" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#cup" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:cop;
    description:put coffee in it" circles-pickup-networked></a-entity>
    <a-entity id="cross" position="13.5 37 -61.5" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#cross" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:cross;
    description:real" circles-pickup-networked></a-entity>
    <a-entity id="painting" position="16 44.2 -72" rotation="0 2.3 0" scale="0.5 0.5 0.5" gltf-model="#painting" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:painting;
    description:brush" circles-pickup-networked></a-entity>

    <!--
    <a-entity environment="preset:default;"></a-entity>
    <a-entity environment="preset: default; fog: 0"></a-entity>
    -->
    <!-- end your code: -->
  </a-scene>

  <!-- Circles' end scripts [REQUIRED] -->
  <circles-end-scripts/>
 </body>
 <script>
  AFRAME.registerComponent('enable-navmesh', {
    init: function () {
      this.el.addEventListener('circles-avatar-ready', () => {
        const player = document.querySelector('[circles-local-avatar]');
        if (player) {
          player.setAttribute('navmesh-constraint', {
            navmesh: '#colera1Nav',
            fall: true,
            height: 2.0
          });
        }
      });
    }
  });
</script>
</html>
