    <a-entity id="Title" position="6 20.4 4.4" rotation="0 240 0" text="value: Medieval Rome (476 CE – 14th century) ; color: #FFFFFF; width: 1.7; wrapCount: 30; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/BebasNeue-Regular-msdf.json; negate: false; lineHeight: 60" scale="2 2 2"></a-entity>
    <a-entity id="text1" position="6 19.3 4.4" rotation="0 240 0" text="value: With the fall of the Western Roman Empire in 476 CE, Medieval Rome entered a period of transition. The city became a center of Christian power, home to the Vatican and the papacy, which reshaped its political and spiritual landscape. The Colosseum, once a symbol of imperial might, was repurposed for different uses, serving as a fortress, workshop, and even a quarry, while the city itself became a hub of Christian pilgrimage and medieval culture. We are currently in the year 1394; width: 1.7; wrapCount: 41.46; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/Nunito-Bold-msdf.json; negate: false; lineHeight: 70" scale="1.6 1.6 1.6"></a-entity>
    
    <a-entity id="Title" position="28 20.2 -24" rotation="0 -90 0" text="value: Collapsed Outer Wall  ; color: #FFFFFF; width: 1.7; wrapCount: 30; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/BebasNeue-Regular-msdf.json; negate: false; lineHeight: 60" scale="2 2 2"></a-entity>
    <a-entity id="text1" position="28 19.3 -24" rotation="0 -90 0" text="value: An earthquake in 1349 caused the Colosseum’s south side to collapse. The exposed interior revealed the skeleton of ancient Rome’s grandeur, even as the stones were scavenged for other buildings.    ; width: 1.7; wrapCount: 41.46; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/Nunito-Bold-msdf.json; negate: false; lineHeight: 70" scale="1.6 1.6 1.6"></a-entity>
    
    <a-entity id="Title" position="15 20.2 -65" rotation="0 20 0" text="value: Church Inside the Colosseum ; color: #FFFFFF; width: 1.7; wrapCount: 30; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/BebasNeue-Regular-msdf.json; negate: false; lineHeight: 60" scale="2 2 2"></a-entity>
    <a-entity id="text1" position="15 19.3 -65" rotation="0 20 0" text="value: During the medieval period, a small Christian church was built into one of the Colosseum’s niches. This religious reuse gave the pagan monument a new spiritual life and played a role in its partial preservation ; width: 1.7; wrapCount: 41.46; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/Nunito-Bold-msdf.json; negate: false; lineHeight: 70" scale="1.6 1.6 1.6"></a-entity>
    
    <a-entity id="Title" position="20 20.2 -48" rotation="0 25 0" text="value: Far Left The Proposed Papal Chapel ; color: #FFFFFF; width: 1.7; wrapCount: 30; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/BebasNeue-Regular-msdf.json; negate: false; lineHeight: 60" scale="2 2 2"></a-entity>
    <a-entity id="text1" position="20 19.3 -48" rotation="0 25 0" text="value: In the 17th century, Pope Sixtus V proposed transforming the Colosseum into a Christian church dedicated to the martyrs believed to have died there. Though never completed, the plan marked a shift toward sacred reinterpretation of the ancient site.    ; width: 1.7; wrapCount: 41.46; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/Nunito-Bold-msdf.json; negate: false; lineHeight: 70" scale="1.6 1.6 1.6"></a-entity>
   
    <a-entity id="Title" position="16.3 20.2 -37" rotation="0 25 0" text="value: Ahead The Frangipane Fortress ; color: #FFFFFF; width: 1.7; wrapCount: 30; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/BebasNeue-Regular-msdf.json; negate: false; lineHeight: 60" scale="2 2 2"></a-entity>
    <a-entity id="text1" position="16.3 19.3 -37" rotation="0 25 0" text="value: In the 12th century, the noble Frangipane family converted the Colosseum into a fortified stronghold. Battlements and barricades transformed the entertainment arena into a defensive hub during Rome’s chaotic medieval period.  ; width: 1.7; wrapCount: 41.46; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/Nunito-Bold-msdf.json; negate: false; lineHeight: 70" scale="1.6 1.6 1.6"></a-entity>

    <a-entity id="bible" position="6.5 19.2 -91" rotation="0 -30 0" scale="0.5 0.5 0.5" gltf-model="#bible" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 2.0 0.0; label_arrow_position:down;
    title:Bible pt.1;
    description:In the time of the Colosseum’s operation (started around 80 CE), the New Testament was still being written, copied, and circulated underground among early Christian communities.
    The Bible as a complete book didn’t exist yet, but letters from apostles and the Gospels were being used secretly.;
    title_back: Bible pt.2;
    description_back: Over time, as Christianity spread and became legal under Constantine (Edict of Milan, 313 CE), the Bible became central to interpreting past Christian suffering, including what was believed to have occurred in the Colosseum.;
    description_offset:0 0.5 0;
    desc_arrow_position:down;
    label_text:Bible;" circles-pickup-networked></a-entity>
    <a-entity id="cup" position="39 19.2 -33" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#cup" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:0 90 0; inspectScale:0.4 0.4 0.4; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:Chalice;
    description:The chalice symbolizes the Eucharist (Holy Communion), representing the blood of Christ, based on the Last Supper narrative in the Gospels.
    While it wasn’t part of the original Roman Colosseum use, it became symbolically tied to places of Christian martyrdom.;
    title_back: Bible pt.2;
    description_back: In later centuries, especially during pilgrimages or religious ceremonies in the Colosseum, the chalice became a sacred object of remembrance, symbolizing the martyrs’ unity with Christ’s sacrifice.
    Some chapels or altars were even placed in the Colosseum, with chalices used in mass held in honor of the martyrs.;
    
    description_offset:0 1.5 0;
    desc_arrow_position:down;
    label_text:Chalice;" circles-pickup-networked></a-entity>
    <a-entity id="cross" position="13.5 17 -61.5" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#cross" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 -1 0; inspectRotation:20 90 0; inspectScale:0.1 0.1 0.1; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 2.0 1.0; label_arrow_position:down;
    title:Cross;
    description: The cross is in association with Roman crucifixion, a common method of execution. However, there is no direct historical evidence that crucifixions were performed inside the Colosseum itself. Instead, the connection comes from broader Roman practices and later Christian traditions.;
    label_text:Cross;" circles-pickup-networked></a-entity>
    <a-entity id="painting" position="16 21 -72" rotation="0 2.3 0" scale="0.5 0.5 0.5" gltf-model="#painting" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 90 0; inspectScale:0.1 0.1 0.1; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 -0.5; label_arrow_position:down;
    title:Roman Capriccio;
    description:This painting is an 18th-century fantasy that brings together iconic Roman ruins in a single idealized scene. While the painting itself belongs to the Baroque era, it indirectly reflects medieval Rome by showcasing how ancient monuments endured through the Middle Ages, often repurposed, pillaged, or built around.;
    label_text:Painting;" circles-pickup-networked></a-entity>



    <a-entity id="shieldObj" position="45.95 1.7 13.05" rotation="0 27 0" scale="0.5 0.5 0.5" gltf-model="#shield" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 -1 0; inspectRotation:0 0 0; inspectScale:0.4 0.4 0.4; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset: 0 1.0 0.5; label_arrow_position:down;
    title:Shield;
    description:Various types of shields were indeed used by gladiators in the Colosseum, a crucial part of their equipment and combat style. The shields were often linked with the type of armor and weapons that were used by each particular gladiator type.;
    title_back: Types of Shields;
    description_back: 1 - Rectangular Shield (Scutum) The Samnite gladiator was known to carry this, sometimes referred to as a scutum. 
    2-  Small, Round Shields,gladiators like the Hoplomachus used this. 
    3 - Parmula or Parma;
    description_offset:0 0.5 0;
    desc_arrow_position:down;
    label_text:Shield;" circles-pickup-networked></a-entity>

 <script>
  AFRAME.registerComponent('enable-navmesh', {
    init: function () {
      this.el.addEventListener('circles-avatar-ready', () => {
        const player = document.querySelector('[circles-local-avatar]');
        if (player) {
          player.setAttribute('navmesh-constraint', {
            navmesh: '#colera1Nav',
            fall: true,
            height: 2.0
          });
        }
      });
    }
  });
