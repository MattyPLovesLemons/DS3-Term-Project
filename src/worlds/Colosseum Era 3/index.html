<html>
<head>
  <!-- Circles' head scripts [REQUIRED] -->
  <circles-start-scripts/>

  <!--other scripts-->
  <script src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

</head>
<body>
  <!-- this is used to create our enter UI that creates a 2D overlay to capture a user gesture for sound/mic access etc. -->
  <circles-start-ui/>

  <!-- a-scene with 'circles-properties' component [REQUIRED] -->
  <a-scene circles_scene_properties fog="type: none" enable-navmesh>
    <a-assets>

      <!--models-->
      <a-asset-item id="coloera1" src="assets/models/colera3v9.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>
      
      <a-asset-item id="colFpalace" src="assets/models/colera2finalPalace.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFfort" src="assets/models/colera2finalFort.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFfloor" src="assets/models/colera2finalFloor.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFplants" src="assets/models/colera2finalplantsv2.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colFobjects" src="assets/models/colera2finalObjectsv3.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

        <a-asset-item id="colPods" src="assets/models/colera3Pods.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="e1tree" src="assets/models/trees2.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>
      <a-asset-item id="e1floor" src="assets/models/floorEra1.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>
      <a-asset-item id="e1build" src="assets/models/era1Buildings.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <a-asset-item id="colera1Nav" src="assets/models/colera3navv4.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="detailObjects" src="assets/models/era1Objectsv3.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="restCol" src="assets/models/colera1baked.glb" response-type="arraybuffer" crossorigin="anonymous"></a-sset-item>

      <!--artifacts-->
      <a-asset-item id="Ecoin" src="assets/models/E3coin.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="Edice" src="assets/models/E3dice.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="Espoon" src="assets/models/E3spoon.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="Epainting3" src="assets/models/E3painting.glb" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>


      <!-- dont use
      
      
      -->

      <!--sounds-->
      <a-asset-item id="crowd" src="assets/sounds/medium-crowd-murmering-6401.mp3" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="seagull" src="assets/sounds/sound-effect-seagulls-157829.mp3" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>
      <a-asset-item id="traffic" src="assets/sounds/traffic-sound-in-city-306545.mp3" response-type="arraybuffer" crossorigin="anonymous"></a-asset-item>

      <!-- HDRI -->
      <img id='skyMap' src='assets/textures/hdri1.jpg' crossorigin="anonymous">

      <!-- Circles' built-in assets [REQUIRED] -->
      <circles-assets/>
    </a-assets>

    <!-- Circles' built-in manager and avatar [REQUIRED] -->
    <circles-manager-avatar/>

    <!--sounds-->
    <a-entity circles-sound="type:music; src:#crowd; autoplay:true; loop:true; volume:0.1;"></a-entity>
    <a-entity circles-sound="type:music; src:#seagull; autoplay:true; loop:true; volume:0.1;"></a-entity>
    <a-entity circles-sound="type:music; src:#traffic; autoplay:true; loop:true; volume:0.1;"></a-entity>

    <!-- Spawning pad -->
   
    <a-entity circles-checkpoint circles-spawnpoint position="0 30 0"></a-entity> <!-- old 10 , 0.05, 32-->
    
    <!--teleport pads -->
    <!--entry ramp-->
    
    
    <!-- start your code: put your A-frame, Circles XR, and custom components here -->
 
    <!--environment-->
    <a-entity id="coloera2" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#coloera1" shadow="cast:false; recieve:true;"></a-entity>
  
    <a-entity id="colera1Nav"  position="0 -0.75 0" scale="0.5 0.5 0.5" gltf-model="#colera1Nav" visible='false' nav-mesh></a-entity>

    <a-entity id="colPods" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colPods" shadow="cast:false; recieve:true;"></a-entity>
    
   <!--
    <a-entity id="coloera2Palace" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFpalace" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="coloera2Fort" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFfort" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="coloera2Floor" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFfloor" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="colera2Plants" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFplants" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="colera2Objects" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#colFobjects" shadow="cast:false; recieve:false;" material="shader: flat;"></a-entity>
    
    -->

    

    <a-entity id="sky" geometry="primitive:sphere; radius:350.0;"  material="src:#skyMap; shader:flat; flatShading:true; side:back;"></a-entity>
    <!--
    <a-entity light="type: ambient; color: #dec07a" intensity="0.3"></a-entity>
    <a-light type="directional" color="#dec07a" intensity="1" position="-1 1 1"></a-light>
  -->

    <!-- dont use
      <a-entity id="detailObjects" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#detailObjects" shadow="cast:true; recieve:true;"></a-entity>
      <a-entity id="era1Floor" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#e1floor" shadow="cast:false; recieve:true;"></a-entity>
      <a-entity id="era1Buildings" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#e1build" shadow="cast:false; recieve:true;"></a-entity>

    <a-entity id="era1tree" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#e1tree" shadow="cast:false; recieve:true;"></a-entity>
    <a-entity id="colera2Nav"  position="0 -0.5 0" scale="0.5 0.5 0.5" gltf-model="#colera1Nav"  visible='false' nav-mesh></a-entity>

 <a-entity id="restCol" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#restCol" shadow="cast:false; recieve:true;"></a-entity>
    <a-entity id="blockwall" position="0 -1 0" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#block" shadow="cast:false; recieve:true;"></a-entity>
      -->

    <!--objects-->
    <a-entity id="coin" position="-5.2 38.4 -17.2" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#Ecoin" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:coin;
    description:mony :>;" circles-pickup-networked></a-entity>  
    <a-entity id="dice" position="-65 39 -31.5" rotation="0 0 -65" scale="0.5 0.5 0.5" gltf-model="#Edice" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:dice;
    description:1-6;" circles-pickup-networked></a-entity>
    <a-entity id="spoon" position="-76 58 -32" rotation="0 0 -41" scale="0.5 0.5 0.5" gltf-model="#Espoon" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:spoon;
    description:for soup;" circles-pickup-networked></a-entity>
    <a-entity id="painting" position="-90 60.4 -32.5" rotation="0 0 2" scale="0.5 0.5 0.5" gltf-model="#Epainting3" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:ANOTHER PAINTING;
    description:more;" circles-pickup-networked></a-entity> 


    <!--
    <a-entity environment="preset:default;"></a-entity>
    <a-entity environment="preset: default; fog: 0"></a-entity>
    -->
    <!-- end your code: -->
  </a-scene>

  <!-- Circles' end scripts [REQUIRED] -->
  <circles-end-scripts/>
 </body>
 <script>
  AFRAME.registerComponent('enable-navmesh', {
    init: function () {
      this.el.addEventListener('circles-avatar-ready', () => {
        const player = document.querySelector('[circles-local-avatar]');
        if (player) {
          player.setAttribute('navmesh-constraint', {
            navmesh: '#colera1Nav',
            fall: true,
            height: 2.0
          });
        }
      });
    }
  });
</script>
</html>
