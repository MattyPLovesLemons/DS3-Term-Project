    <a-entity id="coin" position="-5.2 38.4 -17.2" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#Ecoin" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:Roman Coins;
    description: In ancient times, emperors minted coins depicting the Colosseum to show off their power. Today, coins serve as reminders of empire, propaganda, and cultural legacy.;
    label_text:Coins;" circles-pickup-networked></a-entity>  
    <a-entity id="dice" position="-65 38 -31.5" rotation="0 0 0" scale="0.5 0.5 0.5" gltf-model="#Edice" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:dice;
    description: Dice were common in ancient Rome for gambling and games, even gladiators might have been bet on with dice. Today, dice still symbolize chance and unpredictability.;
    title_back: Tourist Metaphor;
    description_back: Standing in the Colosseum today, dice can represent how life and death were once determined by entertainment, fate, and imperial whim, a sobering reminder for visitors; 
    description_offset:0 0.5 0;
    desc_arrow_position:down;
    label_text:Painting;" circles-pickup-networked></a-entity>
    <a-entity id="spoon" position="-76 58 -32" rotation="0 0 -41" scale="0.5 0.5 0.5" gltf-model="#Espoon" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.6 0.6 0.6; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 1.0 0.0; label_arrow_position:down;
    title:Spoon;
    description: Spoons, especially decorative ones with images of the Colosseum, are popular as collectible souvenirs. They're a way people take a little piece of Rome back home;
    title_back: Common Humanity;
    description_back: The spoon, as a basic tool for eating, contrasts with the Colosseum’s history of excess, violence, and spectacle. It reminds us of daily life, simplicity, and the value of every individual, not just the elites or warriors.; 
    description_offset:0 0.5 0;
    desc_arrow_position:down;
    label_text:Painting;" circles-pickup-networked></a-entity>
    <a-entity id="painting" position="-90 60.4 -32.5" rotation="0 0 2" scale="0.5 0.5 0.5" gltf-model="#Epainting3" shadow="cast:true; recieve:true;" circles-artefact="inspectPosition:0 0 0; inspectRotation:20 0 0; inspectScale:0.1 0.1 0.1; textRotationY=90.0; labelLookAt:true; descriptionLookAt:true; label_offset:0.0 -2.0 0.0; label_arrow_position:down;
    title:The Colosseum;
    description: This painting, from the 17th-century captures the Colosseum as it stood in its prime, complete, majestic and central to Roman life. Once the heart of imperial spectacle, the arena later weathered centuries of change, serving as a fortress and shelter in medieval times. ;
    title_back:The Colosseum;
    description_back: Today, it remains a powerful part of Rome's enduring legacy, bridging ancient glory with the living city around it.; 
    description_offset:0 0.5 0;
    desc_arrow_position:down;
    label_text:Painting;" circles-pickup-networked></a-entity> 


    <a-entity id="Title" position="-4 32.4 -4" rotation="0 40 0" text="value:  Present-Day Rome
    ; color: #FFFFFF; width: 1.7; wrapCount: 30; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/BebasNeue-Regular-msdf.json; negate: false; lineHeight: 60" scale="2 2 2"></a-entity>
    <a-entity id="text1" position="-4 31.3 -4" rotation="0 40 0" text="value: Present-Day Rome emerged as a focal point of the Renaissance in the 15th century, revitalizing its ancient heritage with art, architecture, and intellectual achievements. The city transformed once more, becoming the capital of modern Italy in 1871. Today, Rome is a vibrant metropolis that blends its ancient ruins, medieval history, and Renaissance splendor with contemporary life, attracting millions of visitors and serving as a global center for art, politics, and religion.    ; width: 1.7; wrapCount: 41.46; align: center; tabSize: 4.43; font: /worlds/startarea/assets/font/Nunito-Bold-msdf.json; negate: false; lineHeight: 70" scale="1.6 1.6 1.6"></a-entity>

 </body>
 <script>
  AFRAME.registerComponent('enable-navmesh', {
    init: function () {
      this.el.addEventListener('circles-avatar-ready', () => {
        const player = document.querySelector('[circles-local-avatar]');
        if (player) {
          player.setAttribute('navmesh-constraint', {
            navmesh: '#colera1Nav',
            fall: true,
            height: 2.0
          });
        }
      });
    }
  });
</script>
